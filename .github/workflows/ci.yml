# Spec §14: run the full gate on every push and pull request.
# Pushes to main run this via deploy.yml (workflow_call), so it is not triggered twice.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
