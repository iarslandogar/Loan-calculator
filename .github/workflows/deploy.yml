# Spec §14: on push to main, verify, deploy to GitHub Pages, then smoke-test the live URL.
# One-time manual step: Settings → Pages → Source: GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SMOKE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Wait until Pages serves this commit
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$SMOKE_URL" | grep -q "content=\"$GITHUB_SHA\""; then exit 0; fi
            sleep 10
          done
          echo "Pages did not serve $GITHUB_SHA within 5 minutes" && exit 1
      - run: npx playwright test
