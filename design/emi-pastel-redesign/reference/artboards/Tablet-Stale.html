<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EMI Calculator, tablet stale</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.app{--bg:#F6F3FB;--surface:#FFFFFF;--text:#2A2540;--text-muted:#5C5672;--primary:#CBB9F6;--on-primary:#2A2540;--error:#A8324B;--border:#E6E0F1;--input-border:#867E9E;--focus:#6A50D3;--mint:#D6F2E5;--peach:#FFE4D1;--rose:#F8D5DF;--butter:#FFF2C9;--wash:#EFEAFB;--band:#FAF8FE;--shadow:0 1px 2px rgba(42,37,64,.05),0 10px 30px rgba(106,80,211,.08);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;color:var(--text);background:var(--bg);box-sizing:border-box;min-height:100%}
.app[data-theme=dark]{--bg:#16141E;--surface:#201D2B;--text:#EEEAF8;--text-muted:#B4ADC9;--primary:#C9B8F6;--on-primary:#16141E;--error:#FF9DB2;--border:#332E43;--input-border:#7F7699;--focus:#C9B8F6;--mint:#1E3A30;--peach:#3D2B22;--rose:#3D2230;--butter:#36311D;--wash:#2A2638;--band:#24212F;--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.25)}
.app *,.app *::before,.app *::after{box-sizing:border-box}
.page{max-width:1200px;margin:0 auto;padding:28px 24px 40px}
.app-header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:24px}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.mark{width:48px;height:48px;flex:none}
.app h1{margin:0;font-size:28px;line-height:1.15;font-weight:780;letter-spacing:-.025em}
.tagline{margin:4px 0 0;color:var(--text-muted);font-size:15px}
.theme-field{margin:0 !important;width:180px}
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:24px;box-shadow:var(--shadow);min-width:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;min-width:0}
.app label{font-size:14px;font-weight:650}
.app input,.app select{font:inherit;color:var(--text);background-color:var(--surface);border:1.5px solid var(--input-border);border-radius:14px;min-height:48px;padding:10px 14px;width:100%;font-variant-numeric:tabular-nums}
.app select{appearance:none;padding-right:42px;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat}
.hint{margin:0;font-size:13px;color:var(--text-muted)}
.tenure-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.app button{font:inherit;font-weight:680;min-height:48px;min-width:44px;padding:10px 22px;border-radius:999px;cursor:pointer;line-height:1.2}
.primary{background:var(--primary);color:var(--on-primary);border:1.5px solid var(--primary);box-shadow:inset 0 -3px 0 rgba(42,37,64,.10)}
.secondary{background:transparent;color:var(--text);border:1.5px solid var(--input-border)}
.form-card .primary{flex:1 1 180px}
.app button:disabled{background:var(--bg);color:var(--text-muted);border:1.5px dashed var(--input-border);box-shadow:none;cursor:not-allowed}
.is-focus{outline:3px solid var(--focus);outline-offset:3px}
.status{margin:0;padding:22px 24px;border-radius:20px;display:flex;gap:16px;align-items:center;font-weight:600;line-height:1.4}
.status svg{flex:none;width:40px;height:40px}
.status svg .bg{fill:var(--surface)}
.status svg .ln{stroke:var(--text);fill:none}
.status-idle{background:var(--wash);border:1.5px dashed var(--input-border)}
.status-stale{background:var(--peach);border:2px solid var(--text)}
.history-card h2{font-size:20px;margin:0 0 12px;font-weight:750;letter-spacing:-.01em;border-radius:8px}
.history-card .status{background:var(--bg);font-weight:500;color:var(--text-muted);margin-bottom:16px;padding:18px 20px}
</style>
</helmet>
<div class="app" data-theme="light" style="width: 768px; height: 1400px">
<div class="page">
<header class="app-header">
<div class="brand">
<svg class="mark" viewBox="0 0 52 52" aria-hidden="true"><rect width="52" height="52" rx="16" fill="#EFEAFB"></rect><rect x="10" y="12" width="8" height="28" rx="4" fill="#CBB9F6"></rect><rect x="22" y="19" width="8" height="21" rx="4" fill="#BFE6D3"></rect><rect x="34" y="27" width="8" height="13" rx="4" fill="#FFCFB0"></rect></svg>
<div><h1>Loan EMI Calculator</h1><p class="tagline">Work out the monthly payment, total cost and repayment schedule of a loan.</p></div>
</div>
<div class="field theme-field"><label for="theme">Theme</label><select id="theme"><option>System</option><option>Light</option><option>Dark</option></select></div>
</header>
<main class="layout">
<form class="card form-card">
<div class="field"><label for="currency">Currency</label><select id="currency"><option>PKR (Rs)</option><option>USD ($)</option></select><p class="hint">Changing currency changes the symbol only. Amounts are not converted.</p></div>
<div class="field"><label for="amount">Loan amount (Rs)</label><input id="amount" type="text" value="12,00,000" class="is-focus"></div>
<div class="field"><label for="rate">Annual interest rate (%)</label><input id="rate" type="text" value="12"></div>
<div class="tenure-row">
<div class="field"><label for="tenure">Loan tenure</label><input id="tenure" type="text" value="1"></div>
<div class="field"><label for="unit">Tenure unit</label><select id="unit"><option>Years</option><option>Months</option></select></div>
</div>
<div class="actions"><button type="button" class="primary">Calculate</button><button type="button" class="secondary">Reset</button></div>
</form>
<section class="card results-card">
<div aria-live="polite"><p class="status status-stale"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="bg" cx="20" cy="20" r="20"></circle><path class="ln" d="M28 16a9 9 0 0 0-15.5-2.5M12 24a9 9 0 0 0 15.5 2.5" stroke-width="2.2" stroke-linecap="round"></path><path class="ln" d="M12 9v5h5M28 31v-5h-5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Your inputs have changed. Select Calculate to see updated results.</p></div>
</section>
<section class="card history-card">
<h2 tabindex="-1">Saved calculations</h2>
<p class="status">No saved calculations yet.</p>
<button type="button" class="secondary" disabled>Clear all</button>
</section>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1400}}'>

}
}
</script>
</body>
</html>
